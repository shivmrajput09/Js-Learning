<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Bar</title>
    <link rel="stylesheet" href="polymorphism.css">
</head>

<body>

    <main class="container">

        <section class="progress-section" aria-labelledby="progress-title">

            <h1 id="progress-title">Progress</h1>

            <div class="progress-info">
                <span>Loading...</span>
 <button >download</button>            </div>

            <div
                class="progress-bar"
                role="progressbar"
                aria-valuenow="70"
                aria-valuemin="0"
                aria-valuemax="100"
                aria-label="Loading progress"
            >
                <div class="progress"></div>
            </div>

        </section>

    </main>

</body>
</html>
